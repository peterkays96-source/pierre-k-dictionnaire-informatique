
name: Compiler PIERRE K Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir source
          unzip -q PierreK_Dictionnaire_Informatique_Design.zip -d source

      - name: Compiler APK
        run: |
          cd source
          gradle assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: PIERRE-K-Dictionnaire-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
